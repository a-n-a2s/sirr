 var po=mins(prev[1]),pc=mins(prev[2]);if(pc<=po&&n.m<pc)return{open:1,until:prev[2]};
 if(pc>po&&pc>1440&&n.m<pc-1440)return{open:1,until:prev[2]};
 var o=mins(today[1]),c=mins(today[2]);if(c<=o)c+=1440;
 if(n.m>=o&&n.m<c)return{open:1,until:today[2]};
 if(n.m<o)return{open:0,at:today[1]};return{open:0,at:CAFE.hours[(n.d+1)%7][1]}}

/* ====== الحساب ====== */
function lineUnit(l){var it=BY[l.id],p=it.p;(it.o||[]).forEach(function(g){var G=OPTS[g],sel=l.s[g];if(sel==null)return;(G.type==='one'?[sel]:sel).forEach(function(i){p+=G.o[i][2]})});return p}
function lineDesc(l){var it=BY[l.id],out=[];(it.o||[]).forEach(function(g){var G=OPTS[g],sel=l.s[g];if(sel==null)return;(G.type==='one'?[sel]:sel).forEach(function(i){out.push(st.lang==='en'?G.o[i][1]:G.o[i][0])})});return out.join('، ')}
function cartCount(){return st.cart.reduce(function(a,l){return a+l.q},0)}
function cartTotal(){return st.cart.reduce(function(a,l){return a+lineUnit(l)*l.q},0)}
function inCart(id){return st.cart.filter(function(l){return l.id===id}).reduce(function(a,l){return a+l.q},0)}
function minPrice(it){return it.p}

/* ====== الواجهة ====== */
var app=document.getElementById('app');
function render(){
 document.documentElement.lang=st.lang;document.documentElement.dir=st.lang==='ar'?'rtl':'ltr';

 var os=openState(),q=st.q.trim().toLowerCase();

  '<div class="quick"><button class="qa" data-a="waiter">'+ic('bell')+t('waiter')+'</button><button class="qa" data-a="bill">'+ic('bill')+t('bill')+'</button><button class="qa" data-a="wifi">'+ic('wifi')+t('wifi')+'</button></div>';
 if(!q)h+='<button class="promo" data-open="crs"><div class="art">'+art(BY.crs,1)+'</div><div><span class="k">'+t('promoK')+'</span><b>'+t('promoT')+'</b><span>'+t('promoS')+'</span><span class="pr">'+moneyTxt(1)+'<s>'+moneyTxt(1.75)+'</s></span></div></button>';
 h+='<div class="bar" id="bar"><label class="search'+(st.q?' has':'')+'">'+ic('search')+'<input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="'+t('search')+'" value="'+esc(st.q)+'"><button class="clr" data-a="clr" aria-label="clear">'+ic('x','sm')+'</button></label>'+
  '<nav class="tabs" id="tabs">'+CATS.map(function(c,i){return '<button class="tab'+(i===0?' on':'')+'" data-tab="'+c.id+'">'+esc(nm(c))+'</button>'}).join('')+'</nav></div><main id="list">'+listHTML(q)+infoHTML()+'</main>'+
  '<div class="cartbar" id="cartbar"><button data-a="cart"><span class="n" id="cn"></span><span class="l">'+t('view')+'</span><span class="t" id="ct"></span></button></div>';
 app.innerHTML=h;
 updateBar();bindSpy();
}
function listHTML(q){

 return any?h:'<p class="empty">'+t('noRes')+'</p>';
}

function itemHTML(it){var n=inCart(it.id);
 return '<button class="item" data-open="'+it.id+'"><div class="th">'+art(it)+'</div><div class="bd">'+badges(it)+'<h3>'+esc(nm(it))+'</h3><p class="ds">'+esc(ds(it))+'</p><div class="ft">'+money(it.p)+(n?'<span class="qtyb">×'+n+'</span>':'<span class="add">'+ic('plus','sm')+'</span>')+'</div></div></button>'}

 '<a class="row" href="'+CAFE.map+'" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">'+ic('pin')+'<div class="rb"><b>'+t('loc')+'</b><span>'+t('locS')+'</span></div>'+ic('chev','sm go')+'</a>'+
 '<button class="row" data-a="wifi">'+ic('wifi')+'<div class="rb"><b>'+t('wifi')+'</b><span>'+t('wifiS',{s:CAFE.wifi.ssid})+'</span></div>'+ic('chev','sm go')+'</button></section>'+
 '<button class="demo" data-a="demo"><span class="wa">'+ic('wa')+'</span><div><b>'+t('demoT')+'</b><span>'+t('demoS')+'</span></div></button>'+
 '<p class="foot">'+t('foot')+'<br>© دَلّة · DALLA</p>'}

 '<circle cx="60" cy="60" r="56" fill="none" stroke="url(#mg)" stroke-width="1.5" opacity=".7"/><circle cx="60" cy="60" r="50" fill="rgba(255,255,255,.04)" stroke="url(#mg)" stroke-width=".8" opacity=".6"/>'+
 '<g fill="none" stroke="#f3d3ad" stroke-width="2.4" stroke-linecap="round" opacity=".9"><path class="stm" d="M50 36c-3-4 3-6 0-10"/><path class="stm b" d="M58 34c-3-4 3-6 0-10"/></g>'+
 '<path d="M69 54c10-1 15-9 21-18l3 2c-4 10-11 18-21 21z" fill="url(#mg)"/><path d="M47 52c-9 2-10 17-2 23" fill="none" stroke="url(#mg)" stroke-width="3" stroke-linecap="round"/>'+
 '<path d="M54 44c-9 9-10 28-6 40h22c4-12 3-31-6-40z" fill="url(#mg)"/><rect x="46" y="83" width="26" height="5" rx="2.5" fill="url(#mg)"/><path d="M51 45c2.5-8 13.5-8 16 0z" fill="url(#mg)"/><circle cx="59" cy="36.5" r="2.6" fill="#f3c88e"/>'+
 '<path d="M56 48c-5 8-6 22-4 33" stroke="#fff" stroke-width="2" opacity=".35" fill="none" stroke-linecap="round"/></svg>'}

function updateBar(){var n=cartCount(),cb=document.getElementById('cartbar');if(!cb)return;
 cb.classList.toggle('show',n>0);document.getElementById('cn').textContent=n;document.getElementById('ct').textContent=moneyTxt(cartTotal());}
function refreshList(){var l=document.getElementById('list');if(!l)return;l.innerHTML=listHTML(st.q.trim().toLowerCase())+infoHTML();bindSpy();updateBar()}

/* scroll spy */
var spyObs;
function bindSpy(){if(spyObs)spyObs.disconnect();if(!('IntersectionObserver' in window))return;
 spyObs=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)setTab(e.target.getAttribute('data-sec'))})},{rootMargin:'-130px 0px -65% 0px'});
 document.querySelectorAll('.sec').forEach(function(s){spyObs.observe(s)})}
var tabLock=0;
function setTab(id){if(Date.now()<tabLock)return;document.querySelectorAll('.tab').forEach(function(b){var on=b.getAttribute('data-tab')===id;b.classList.toggle('on',on);if(on){var nav=b.parentNode,x=b.offsetLeft-nav.clientWidth/2+b.clientWidth/2;nav.scrollTo({left:x,behavior:'smooth'})}})}

/* ====== الشيت ====== */
var ov=null;
function openSheet(html,cls){closeSheet(true);ov=document.createElement('div');ov.className='ov';ov.innerHTML='<div class="sheet '+(cls||'')+'" role="dialog" aria-modal="true">'+html+'</div>';
 document.body.appendChild(ov);document.body.style.overflow='hidden';requestAnimationFrame(function(){requestAnimationFrame(function(){ov&&ov.classList.add('in')})});
 ov.addEventListener('click',function(e){if(e.target===ov)closeSheet()});bindDrag(ov.querySelector('.sheet'))}
function closeSheet(now){if(!ov)return;var o=ov;ov=null;document.body.style.overflow='';if(now){o.remove();return}o.classList.remove('in');setTimeout(function(){o.remove()},320)}
function bindDrag(sh){var y0=null,dy=0,sc=sh.querySelector('.sc');
 sh.addEventListener('touchstart',function(e){if(sc&&sc.scrollTop>0&&!e.target.closest('.hd'))return;y0=e.touches[0].clientY;dy=0;sh.style.transition='none'},{passive:true});
 sh.addEventListener('touchmove',function(e){if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0)sh.style.transform='translateY('+dy+'px)'},{passive:true});
 sh.addEventListener('touchend',function(){if(y0==null)return;sh.style.transition='';sh.style.transform='';if(dy>110)closeSheet();y0=null})}

var cur=null; // {id,s,q,note,idx}
function openItem(id,idx){var it=BY[id];if(!it)return;
 var l=idx!=null?st.cart[idx]:null;
 cur={id:id,q:l?l.q:1,note:l?l.n||'':'',idx:idx,s:{}};
 (it.o||[]).forEach(function(g){var G=OPTS[g];cur.s[g]=l?JSON.parse(JSON.stringify(l.s[g]==null?(G.type==='one'?0:[]):l.s[g])):(G.type==='one'?0:[])});
 openSheet(itemSheet(),'it');}
function itemSheet(){var it=BY[cur.id],m=[];
 if(it.kcal!=null)m.push(it.kcal+' '+t('kcal'));if(it.min)m.push('⏱ '+it.min+' '+t('min'));
 return '<div class="hd"><span class="grab"></span><button class="x" data-a="close" aria-label="close">'+ic('x')+'</button></div><div class="sc"><div class="hero">'+heroArt(it)+'</div>'+
 '<div class="pd">'+badges(it)+'<h3>'+esc(nm(it))+'</h3><div class="en">'+esc(st.lang==='ar'?it.en:it.ar)+'</div><p>'+esc(ds(it))+'</p>'+(m.length?'<div class="meta">'+m.map(function(x){return '<span>'+x+'</span>'}).join('')+'</div>':'')+'</div>'+
 (it.o||[]).map(function(g){var G=OPTS[g],one=G.type==='one';return '<div class="og"><h4>'+esc(L(G))+'<small>'+(G.req?t('req'):t('opt'))+'</small></h4>'+G.o.map(function(o,i){var on=one?cur.s[g]===i:cur.s[g].indexOf(i)>-1;
  return '<button class="opt'+(one?'':' ck')+(on?' on':'')+'" data-opt="'+g+':'+i+'"><span class="rd"></span><span class="ol">'+esc(st.lang==='en'?o[1]:o[0])+'</span><span class="op">'+(o[2]?'+ '+moneyTxt(o[2]):'')+'</span></button>'}).join('')+'</div>'}).join('')+
 '<div class="note-f"><label for="nt">'+t('note')+'</label><textarea id="nt" rows="2" maxlength="140" placeholder="'+t('noteP')+'">'+esc(cur.note)+'</textarea></div></div>'+
 '<div class="sf"><div class="stp"><button data-a="qm" aria-label="-">'+ic('minus','sm')+'</button><b id="iq">'+cur.q+'</b><button data-a="qp" aria-label="+">'+ic('plus','sm')+'</button></div><button class="cta" data-a="addit" id="addb">'+addLabel()+'</button></div>'}
function addLabel(){var u=lineUnit(cur)*cur.q;return '<span>'+(cur.idx!=null?t('update'):t('add'))+'</span><span>'+moneyTxt(u)+'</span>'}
function addItem(){var nt=document.getElementById('nt');cur.note=nt?nt.value.trim():'';
 var line={id:cur.id,s:cur.s,q:cur.q,n:cur.note};
 if(cur.idx!=null){st.cart[cur.idx]=line}else{var k=JSON.stringify([line.id,line.s,line.n]),ex=st.cart.filter(function(l){return JSON.stringify([l.id,l.s,l.n])===k})[0];if(ex)ex.q+=line.q;else st.cart.push(line)}
 saveCart();var wasCart=cur.idx!=null;closeSheet();refreshList();
 var b=document.querySelector('#cartbar button');if(b){b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')}
 if(wasCart)setTimeout(openCart,330);else toast(t('added'))}

function openCart(){openSheet(cartSheet(),'cart')}
function cartSheet(){
 var h='<div class="hd ch"><h3>'+t('cart')+'</h3><button class="x" data-a="close" aria-label="close">'+ic('x')+'</button></div><div class="sc">';
 if(!st.cart.length)return h+'<p class="empty">'+t('empty')+'</p></div>';
 h+=st.cart.map(function(l,i){var it=BY[l.id],d=lineDesc(l);return '<div class="ln"><button class="th" data-edit="'+i+'">'+art(it)+'</button><button class="lb" data-edit="'+i+'" style="text-align:start"><b>'+esc(nm(it))+'</b>'+(d?'<span>'+esc(d)+'</span>':'')+(l.n?'<span>“'+esc(l.n)+'”</span>':'')+'<i>'+moneyTxt(lineUnit(l)*l.q)+'</i></button>'+
  '<div class="stp"><button data-lm="'+i+'" aria-label="-">'+ic('minus','sm')+'</button><b>'+l.q+'</b><button data-lp="'+i+'" aria-label="+">'+ic('plus','sm')+'</button></div></div>'}).join('');
 h+='<div style="height:14px"></div><div class="seg"><button class="'+(st.mode==='dine'?'on':'')+'" data-mode="dine">'+t('dine')+'</button><button class="'+(st.mode==='take'?'on':'')+'" data-mode="take">'+t('take')+'</button></div>';
 if(st.mode==='dine')h+='<div class="fld"><label for="ft">'+t('tableL')+'</label><input id="ft" inputmode="numeric" maxlength="3" placeholder="'+t('tableP')+'" value="'+esc(st.table)+'"></div>';
 else h+='<div class="fld"><label for="fn">'+t('nameL')+'</label><input id="fn" maxlength="40" placeholder="'+t('nameP')+'" value="'+esc(st.name)+'"></div><div class="fld"><label for="fm">'+t('timeL')+'</label><input id="fm" maxlength="40" placeholder="'+t('timeP')+'" value="'+esc(st.time)+'"></div>';
 var tot=cartTotal();
 h+='<div class="tot"><div><span>'+t('sub')+' · '+t('items',{n:cartCount()})+'</span><span>'+moneyTxt(tot)+'</span></div><div class="g"><span>'+t('total')+' <small style="font-weight:400;color:var(--muted);font-size:12px">('+t('tax')+')</small></span><span>'+moneyTxt(tot)+'</span></div></div>'+
  '<p class="hint">'+ic('info','sm')+t('hint')+'</p></div><div class="sf"><button class="cta wa" data-a="send">'+ic('wa')+t('send')+'</button></div>';
 return h}
function rerenderCart(){if(!ov)return;var sc=ov.querySelector('.sc'),top=sc?sc.scrollTop:0;ov.querySelector('.sheet').innerHTML=cartSheet();var n=ov.querySelector('.sc');if(n)n.scrollTop=top;bindDrag(ov.querySelector('.sheet'))}
function readFields(){var a=document.getElementById('ft'),b=document.getElementById('fn'),c=document.getElementById('fm');if(a)st.table=a.value.replace(/\D/g,'');if(b)st.name=b.value.trim();if(c)st.time=c.value.trim();if(st.table)ss('dalla_t',st.table)}
function sendOrder(){readFields();
 if(st.mode==='dine'&&!st.table){toast(t('needTable'));var f=document.getElementById('ft');f&&f.focus();return}
 if(st.mode==='take'&&!st.name){toast(t('needName'));var g=document.getElementById('fn');g&&g.focus();return}
 var ln=['*'+t('oHead')+' · دَلّة*',''];
 ln.push(t('oType')+': '+(st.mode==='dine'?t('dine'):t('take')));
 if(st.mode==='dine')ln.push(t('oTable')+': '+st.table);else{ln.push(t('oName')+': '+st.name);if(st.time)ln.push(t('oTime')+': '+st.time)}
 ln.push('');
 st.cart.forEach(function(l){var it=BY[l.id],d=lineDesc(l);ln.push('• '+l.q+' × '+nm(it)+(d?' ('+d+')':'')+' = '+moneyTxt(lineUnit(l)*l.q));if(l.n)ln.push('   '+t('oNote')+': '+l.n)});
 ln.push('');ln.push('*'+t('total')+': '+moneyTxt(cartTotal())+'*');
 wa(CAFE.wa,ln.join('\n'))}
function needTable(cb){if(st.table){cb();return}
 openSheet('<div class="hd ch"><h3>'+t('askTable')+'</h3><button class="x" data-a="close">'+ic('x')+'</button></div><div class="sc"><div class="fld"><input id="ft2" inputmode="numeric" maxlength="3" placeholder="'+t('tableP')+'"></div><div style="height:12px"></div></div><div class="sf"><button class="cta" data-a="tok">OK</button></div>');
 needTable.cb=cb;setTimeout(function(){var f=document.getElementById('ft2');f&&f.focus()},350)}

/* ====== الأحداث ====== */
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-a],[data-open],[data-tab],[data-opt],[data-edit],[data-lm],[data-lp],[data-mode]');if(!el)return;
 var a=el.getAttribute('data-a');
 if(el.hasAttribute('data-open')){openItem(el.getAttribute('data-open'));return}
 if(el.hasAttribute('data-tab')){var id=el.getAttribute('data-tab'),s=document.getElementById('s-'+id);if(s){tabLock=0;setTab(id);tabLock=Date.now()+700;s.scrollIntoView({behavior:'smooth',block:'start'})}return}
 if(el.hasAttribute('data-opt')){var p=el.getAttribute('data-opt').split(':'),g=p[0],i=+p[1],G=OPTS[g];
  if(G.type==='one')cur.s[g]=i;else{var ix=cur.s[g].indexOf(i);if(ix>-1)cur.s[g].splice(ix,1);else cur.s[g].push(i)}
  el.parentNode.querySelectorAll('.opt').forEach(function(b,j){b.classList.toggle('on',G.type==='one'?j===cur.s[g]:cur.s[g].indexOf(j)>-1)});document.getElementById('addb').innerHTML=addLabel();return}
 if(el.hasAttribute('data-edit')){var k=+el.getAttribute('data-edit');readFields();closeSheet(true);openItem(st.cart[k].id,k);return}
 if(el.hasAttribute('data-lm')||el.hasAttribute('data-lp')){readFields();var j=+(el.getAttribute('data-lm')||el.getAttribute('data-lp'));st.cart[j].q+=el.hasAttribute('data-lp')?1:-1;if(st.cart[j].q<1)st.cart.splice(j,1);saveCart();refreshList();rerenderCart();return}
 if(el.hasAttribute('data-mode')){readFields();st.mode=el.getAttribute('data-mode');rerenderCart();return}
 switch(a){
  case 'lang':st.lang=st.lang==='ar'?'en':'ar';ls('dalla_lang',st.lang);render();window.scrollTo(0,0);break;
  case 'close':closeSheet();break;
  case 'qm':if(cur.q>1){cur.q--;document.getElementById('iq').textContent=cur.q;document.getElementById('addb').innerHTML=addLabel()}break;
  case 'qp':if(cur.q<20){cur.q++;document.getElementById('iq').textContent=cur.q;document.getElementById('addb').innerHTML=addLabel()}break;
  case 'addit':addItem();break;
  case 'cart':openCart();break;
  case 'send':sendOrder();break;
  case 'clr':st.q='';refreshList();var qi=document.getElementById('q');qi.value='';qi.parentNode.classList.remove('has');qi.focus();break;
  case 'waiter':needTable(function(){wa(CAFE.wa,t('waiterMsg',{n:st.table}))});break;
  case 'bill':needTable(function(){wa(CAFE.wa,t('billMsg',{n:st.table}))});break;
  case 'tok':var v=(document.getElementById('ft2').value||'').replace(/\D/g,'');if(!v){toast(t('needTable'));return}st.table=v;ss('dalla_t',v);closeSheet(true);render();needTable.cb&&needTable.cb();break;
  case 'wifi':copy(CAFE.wifi.pass);toast(t('copied')+' · '+CAFE.wifi.pass);break;
  case 'demo':wa(CAFE.maker,st.lang==='ar'?'مرحبا، شفت منيو دَلّة التجريبي وبدي منيو ذكي زيه لمحلي.':'Hi, I saw the Dalla demo menu and I want a smart menu like it.');break;
 }
});
document.addEventListener('input',function(e){if(e.target.id==='q'){st.q=e.target.value;e.target.parentNode.classList.toggle('has',!!st.q);refreshList()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
window.addEventListener('scroll',function(){var b=document.getElementById('bar');if(b)b.classList.toggle('stuck',b.getBoundingClientRect().top<=0)},{passive:true});
function copy(s){try{navigator.clipboard.writeText(s)}catch(e){var x=document.createElement('textarea');x.value=s;document.body.appendChild(x);x.select();try{document.execCommand('copy')}catch(_){}x.remove()}}
render();
})();
