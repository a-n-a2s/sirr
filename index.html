<style id="sirr-css">/* Layout: a black boutique frame (header, hero, footer) around a pearl-white shop floor; gold is the thread between them — hairlines, prices, the open section. */
:root,.dark{
  --ink:#0d0c0b; --ink-1:#151310; --ink-2:#1c1915; --ink-3:#29241e; --line:#3a3128; --line-soft:#2a241e;
  --cream:#f7f2e8; --tx2:#ddd3c2; --mute:#aa9e8a; --faint:#72685b;
  --gold:#c9a55c; --gold-hi:#ecd49a; --gold-lo:#8c6f38; --gold-tint:rgba(201,165,92,.1);
  --ok:#86c595; --warn:#e6b45f; --bad:#e3806f; --info:#9cb8d9; --rose:#e8bcb5; --wa:#5fd38d;
  --shadow:0 18px 40px -24px rgba(0,0,0,.9);
  color-scheme:dark;
}
:root{
  --black:#0d0c0b; --night:#17130e; --pearl:#f7f3eb; --white:#ffffff; --on-gold:#1a140a;
  --f-ar:"Readex Pro","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-en:"Cormorant Garamond","Times New Roman",Georgia,serif;
  --f-ruqaa:"Aref Ruqaa","Readex Pro",serif;
  --r-sm:10px; --r-md:16px; --r-lg:20px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
.lite{
  --ink:#f7f3eb; --ink-1:#ffffff; --ink-2:#f2ece0; --ink-3:#e7dece; --line:#e3d9c7; --line-soft:#ede6d9;
  --cream:#17130e; --tx2:#4b4236; --mute:#796e5e; --faint:#a4988a;
  --gold:#c9a55c; --gold-hi:#8a6729; --gold-lo:#d4ba82; --gold-tint:rgba(201,165,92,.13);
  --ok:#2f7d4a; --warn:#94590b; --bad:#b4432f; --info:#36689b; --rose:#a8564d; --wa:#1d9b54;
  --shadow:0 1px 2px rgba(23,19,14,.05),0 16px 32px -22px rgba(23,19,14,.4);
  color-scheme:light; color:var(--cream);
}
.dark{color:var(--cream)}
.bg{background:var(--ink)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
body{background:var(--black);color:var(--cream);font-family:var(--f-ar);font-size:15px;line-height:1.65;min-height:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--black)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
img,video{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px;border-radius:6px}
::selection{background:var(--gold);color:var(--on-gold)}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ltr{direction:ltr;unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:18px;height:18px}.ico.lg{width:28px;height:28px}
[dir=rtl] .flip{transform:scaleX(-1)}
.fab-i{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;flex:none}
.fab-i svg{width:100%;height:100%}
.orn{width:15px;height:15px;flex:none;color:var(--gold)}

/* announcement + header */
.announce{background:linear-gradient(90deg,var(--gold-lo),var(--gold),var(--gold-lo));color:var(--on-gold);text-align:center;font-size:13px;font-weight:500;padding-block:7px}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(13,12,11,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(201,165,92,.32)}
.hdr .wrap{display:flex;align-items:center;gap:12px;height:66px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:46px;height:46px;flex:none}
.brand .bt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand .bt b{font-family:var(--f-en);font-weight:600;letter-spacing:.32em;font-size:15px;color:var(--white)}
.brand .bt span{font-size:11.5px;color:var(--gold-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .sp{flex:1}
.hbtn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;min-width:42px;padding-inline:10px;border-radius:999px;border:1px solid var(--line);color:var(--white);transition:border-color .2s,background .2s}
.hbtn:hover{border-color:var(--gold-lo);background:var(--ink-2)}
.hbtn .lbl{font-size:13px}
.hbtn.lang{font-family:var(--f-en);font-weight:600;letter-spacing:.08em;font-size:14px}
.hbtn.adm{border-color:var(--gold-lo);color:var(--gold-hi)}
.badge-n{position:absolute;top:-4px;inset-inline-end:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:var(--on-gold);font-size:11.5px;font-weight:700;display:grid;place-items:center;padding-inline:5px}
.bump{animation:bump .5s var(--ease)}
@keyframes bump{30%{transform:scale(1.25)}}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--black)}
.hero::before{content:"";position:absolute;inset:-20% -10% auto;height:120%;background:radial-gradient(48% 42% at 50% 34%,rgba(201,165,92,.17),transparent 70%),radial-gradient(30% 30% at 80% 72%,rgba(232,188,181,.08),transparent 70%);pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:1fr;gap:14px;justify-items:center;text-align:center;padding-block:16px 30px}
.seal{width:min(220px,58vw);aspect-ratio:1;perspective:900px;touch-action:pan-y;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative}
.seal svg{width:100%;height:100%;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s var(--ease);will-change:transform}
.seal .r1,.seal .r2{stroke-dasharray:5300;stroke-dashoffset:5300;animation:draw 2.2s var(--ease) .15s forwards}
.seal .r2{animation-delay:.45s}
.seal .st{transform-origin:1080px 654px;transform-box:view-box;animation:starIn 1.1s var(--ease) .9s both,twinkle 3.6s ease-in-out 2.2s infinite}
.seal .mk{animation:rise 1.1s var(--ease) .55s both}
.seal .wd{animation:rise 1s var(--ease) 1s both}
.seal .spark{position:absolute;width:8px;height:8px;margin:-4px;pointer-events:none;background:var(--gold-hi);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:spark .9s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes starIn{from{opacity:0;transform:scale(.2) rotate(-90deg)}to{opacity:1;transform:none}}
@keyframes twinkle{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.28) rotate(45deg);opacity:.75}}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes spark{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
.htxt{display:grid;gap:10px;justify-items:center;min-width:0;width:100%}
.hero h1{margin:0;font-weight:600;font-size:clamp(26px,6.6vw,44px);line-height:1.3;text-wrap:balance;color:var(--white)}
[lang=en] .hero h1{font-family:var(--f-en);font-weight:600;font-size:clamp(30px,7vw,50px);letter-spacing:.01em}
.hero .story{margin:0;font-family:var(--f-ruqaa);font-size:clamp(19px,4.8vw,28px);line-height:1.6;color:var(--gold-hi);text-wrap:balance;max-width:28ch}
[lang=en] .hero .story{font-family:var(--f-en);font-style:italic;font-weight:500}
.hero .sub{margin:0;color:#d4c9b6;font-size:14px;display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.hero .sub i{width:4px;height:4px;border-radius:50%;background:var(--gold);display:inline-block}
.hero-cta{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:440px;margin-top:6px}
.hero-cta .btn{padding-inline:12px;font-size:14.5px;white-space:normal;line-height:1.25;text-align:center}
@media (min-width:860px){
  .hero .wrap{grid-template-columns:auto 1fr;text-align:start;justify-items:start;align-items:center;gap:56px;padding-block:40px 52px}
  .seal{width:330px}
  .htxt{justify-items:start;gap:14px}
  .hero .sub{justify-content:flex-start}
  .hero-cta{display:flex;flex-wrap:wrap;width:auto;max-width:none}
  .hero-cta .btn{padding-inline:24px;white-space:nowrap}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:50px;padding-inline:22px;border-radius:999px;font-weight:500;font-size:15px;transition:transform .15s,background .2s,border-color .2s,color .2s,filter .2s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.gold{background:linear-gradient(180deg,#f1dba3,#c9a55c 55%,#b08c45);color:var(--on-gold);box-shadow:0 8px 24px -12px rgba(201,165,92,.7),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.gold:hover{filter:brightness(1.06)}
.btn.white{background:var(--white);color:var(--night);box-shadow:0 10px 26px -16px rgba(255,255,255,.55)}
.btn.white:hover{background:#f3ede2}
.btn.white .fab-i{color:#1d9b54}
.btn.dark{background:var(--night);color:#f7f2e8;border:1px solid var(--night)}
.btn.dark:hover{background:#000}
.btn.dark .ico{color:#ecd49a}
.btn.line{border:1px solid var(--gold-lo);color:var(--gold-hi)}
.btn.line:hover{background:var(--gold-tint)}
.btn.ghost{color:var(--mute)}
.btn.ghost:hover{color:var(--cream)}
.btn.wa{background:#1f3b2c;color:#e9f7ee;border:1px solid #2f5a42}
.btn.wa:hover{background:#244634}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding-inline:16px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.danger{border:1px solid rgba(214,108,88,.5);color:var(--bad)}

/* sections */
.sec{padding-block:36px}
.sec.pt0{padding-top:6px}
.shop{border-top:1px solid var(--gold);position:relative}
.shop .sec:first-child{padding-top:26px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
.sh{flex:1;min-width:0;margin:0;display:flex;align-items:center;gap:10px;font-size:clamp(21px,5vw,28px);font-weight:600;line-height:1.3;color:var(--cream)}
.sh::after{content:"";flex:1;min-width:24px;height:1px;background:linear-gradient(to left,var(--gold),transparent)}
[dir=ltr] .sh::after{background:linear-gradient(to right,var(--gold),transparent)}
[lang=en] .sh{font-family:var(--f-en);font-size:clamp(25px,5.4vw,33px)}
.eyebrow{display:flex;align-items:center;gap:10px;color:var(--gold-hi);font-size:12.5px;letter-spacing:.14em;margin-bottom:6px;font-family:var(--f-en);font-weight:600;text-transform:uppercase}
[lang=ar] .eyebrow{letter-spacing:.02em;font-family:var(--f-ar);font-weight:500}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--gold)}
.more{color:var(--gold-hi);font-size:14px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}

/* sections tiles — rounded squares */
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:760px){.cats{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}}
.cat{position:relative;isolation:isolate;overflow:hidden;aspect-ratio:1;max-width:100%;width:100%;border-radius:var(--r-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px;text-align:center;font:inherit;transition:transform .35s var(--ease),box-shadow .35s,border-color .3s}
.cat>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.cat .ci{width:54px;height:54px;border-radius:50%;display:grid;place-items:center}
.cat .ci .ico{width:27px;height:27px;stroke-width:1.4}
.cat .nm{font-size:clamp(16px,4.3vw,21px);font-weight:600;line-height:1.3}
.cat .ct{font-size:12.5px}
.cat .cd{font-size:13.5px;line-height:1.55}
.cat.open{color:var(--white);border:1px solid rgba(201,165,92,.6);box-shadow:0 18px 34px -20px rgba(23,19,14,.75),inset 0 0 0 1px rgba(236,212,154,.08)}
.cat.open:hover{transform:translateY(-3px);border-color:var(--gold)}
.cat.open .ci{border:1px solid rgba(201,165,92,.55);color:#ecd49a;background:rgba(13,12,11,.25)}
.cat.open .ct{color:#e3cf9c}
.cat.open .cd{color:#d8cdb9}
.cat.open .go{position:absolute;bottom:11px;inset-inline-end:11px;width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--on-gold);display:grid;place-items:center}
.cat.open .go .ico{width:16px;height:16px;stroke-width:2}
.cat.open.img{justify-content:flex-end}
.cat.open.img::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(13,12,11,.88),rgba(13,12,11,.15) 62%)}
.cat.shut{background:var(--white);border:1px dashed #d6c497;color:#8b806f;cursor:default}
.cat.shut .ci{border:1px solid #ebe2cf;color:#b8a988;background:#fbf8f2}
.cat.shut .nm{color:#5c5344}
.cat.shut .cd{color:#8b806f}
.cat.shut.img>img{filter:grayscale(1);opacity:.35}
.lockc{position:absolute;top:10px;inset-inline-start:10px;display:inline-flex;align-items:center;gap:4px;height:25px;padding-inline:9px;border-radius:999px;background:#f4ede0;color:#7a6847;font-size:11.5px;font-weight:600}
.lockc .ico{width:13px;height:13px;stroke-width:2}
.cat.wide{grid-column:1/-1;aspect-ratio:auto;min-height:150px;flex-direction:row;justify-content:flex-start;text-align:start;gap:18px;padding:20px}
.cat.wide .cb{display:grid;gap:6px;min-width:0;padding-inline-end:36px}
.cat.wide .ci{width:72px;height:72px}
.cat.wide .ci .ico{width:34px;height:34px}
.cat.wide .nm{font-size:clamp(20px,5vw,28px)}
.cat.wide .lockc{position:static;width:max-content}
:root{
  --g-gold:radial-gradient(85% 70% at 50% 28%,rgba(236,212,154,.32),transparent 70%),linear-gradient(165deg,#271e12,#0e0c09);
  --g-rose:radial-gradient(85% 70% at 50% 28%,rgba(232,188,181,.32),transparent 70%),linear-gradient(165deg,#2b1b19,#0f0b0a);
  --g-noir:repeating-linear-gradient(135deg,rgba(201,165,92,.09) 0 1px,transparent 1px 14px),linear-gradient(165deg,#1b1815,#0a0908);
  --g-champ:radial-gradient(85% 70% at 50% 30%,rgba(240,230,210,.26),transparent 70%),linear-gradient(165deg,#2c271f,#12100c);
}
.st-gold{background:var(--g-gold)}.st-rose{background:var(--g-rose)}.st-noir{background:var(--g-noir)}.st-champ{background:var(--g-champ)}

/* banner carousel */
.banners{padding-top:34px}
.bn-track{display:grid;grid-auto-flow:column;grid-auto-columns:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:var(--r-lg);border:1px solid rgba(201,165,92,.45)}
.bn-track::-webkit-scrollbar{display:none}
.bn{position:relative;scroll-snap-align:center;aspect-ratio:16/7;min-height:190px;max-height:440px;max-width:100%;overflow:hidden;display:flex;align-items:flex-end;background:var(--ink-2)}
.bn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bn .bn-txt{position:relative;padding:22px;width:100%;background:linear-gradient(0deg,rgba(13,12,11,.92),rgba(13,12,11,.35) 70%,transparent);display:grid;gap:4px}
.bn h3{margin:0;font-size:clamp(19px,4.6vw,28px);font-weight:600;line-height:1.35;color:var(--white)}
.bn p{margin:0;color:var(--gold-hi);font-size:14px}
.bn.txt{aspect-ratio:auto;min-height:200px;background:radial-gradient(60% 90% at 85% 20%,rgba(232,188,181,.16),transparent 60%),radial-gradient(70% 100% at 10% 100%,rgba(201,165,92,.24),transparent 60%),#121009;align-items:center}
.bn.txt .bn-txt{background:none;padding:28px}
.bn.txt .bn-txt::before{content:"";position:absolute;inset:12px;border:1px solid rgba(201,165,92,.38);border-radius:14px;pointer-events:none}
.bn-dots{display:flex;gap:6px;justify-content:center;margin-top:12px}
.bn-dots button{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width .3s,background .3s}
.bn-dots button.on{width:22px;background:var(--gold)}

/* products */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}}
@media (min-width:1060px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pc{position:relative;display:flex;flex-direction:column;background:var(--ink-1);border:1px solid var(--line-soft);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow);transition:border-color .3s,transform .35s var(--ease);min-width:0}
.pc:hover{border-color:var(--gold-lo);transform:translateY(-3px)}
.pc .ph{position:relative;aspect-ratio:4/5;background:var(--ink-2);overflow:hidden}
.pc .ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.pc:hover .ph img{transform:scale(1.04)}
.pc .ph svg.art{width:100%;height:100%}
.pc .tags{position:absolute;top:10px;inset-inline-start:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pc .pb{display:grid;gap:4px;padding:12px 12px 14px;flex:1}
.pc h3{margin:0;font-size:15px;font-weight:500;line-height:1.45;color:var(--cream)}
.pc .meta{color:var(--mute);font-size:12.5px}
.pc .prow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price b{color:var(--gold-hi);font-weight:600;font-size:16px}
.price s{color:var(--faint);font-size:13px}
.addc{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--night);color:#ecd49a;flex:none;transition:transform .2s,background .2s}
.addc:hover{transform:scale(1.08);background:#000}
.addc[disabled]{background:var(--ink-3);color:var(--faint)}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding-inline:10px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.chip .ico{width:13px;height:13px;stroke-width:2}
.chip.best{background:#c9a55c;color:#1a140a}
.chip.new{background:#e8bcb5;color:#2b1714}
.chip.offer{background:#1a140a;color:#ecd49a;border:1px solid #8c6f38}
.chip.limited{background:#2b1d1b;color:#f0c9c2;border:1px solid #b98681}
.chip.custom{background:#17130e;color:#f7f2e8;border:1px solid #3a3128}
.chip.out{background:rgba(13,12,11,.85);color:#c9bfae;border:1px solid #3a3128}
.chip.sample{background:rgba(13,12,11,.74);color:#ddd3c2;border:1px dashed #8a7f6e;font-weight:400}
.chip.save{background:rgba(134,197,149,.16);color:var(--ok)}
.chip.st-open{background:rgba(134,197,149,.16);color:var(--ok)}
.chip.st-closed{background:#f4ede0;color:#7a6847;border:1px solid #e3d5b6}
.soldout .ph{filter:grayscale(.7) brightness(.8)}

/* empty */
.empty{display:grid;justify-items:center;gap:10px;text-align:center;padding:40px 18px;border:1px dashed var(--line);border-radius:var(--r-lg);color:var(--mute);background:var(--ink-1)}
.empty .ico{width:40px;height:40px;color:var(--gold);stroke-width:1.2}
.empty b{color:var(--cream);font-weight:500;font-size:16px}

/* inner pages */
.page{min-height:60vh;padding-bottom:44px}
.phd{padding-block:22px 6px;display:grid;gap:8px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mute);font-size:14px;width:max-content;min-height:40px}
.back:hover{color:var(--cream)}
.phd h1{margin:0;font-size:clamp(24px,5.6vw,36px);font-weight:600;line-height:1.3;text-wrap:balance}
[lang=en] .phd h1{font-family:var(--f-en)}
.phd p{margin:0;color:var(--mute);max-width:62ch}

/* product page */
.pd{display:grid;grid-template-columns:1fr;gap:26px;padding-block:10px 20px}
@media (min-width:900px){.pd{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:start}}
.gal{display:grid;gap:10px;min-width:0}
.gal-main{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:var(--ink-2);box-shadow:var(--shadow)}
.gal-track{display:grid;grid-auto-flow:column;grid-auto-columns:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal-track::-webkit-scrollbar{display:none}
.gal-item{scroll-snap-align:center;aspect-ratio:1;display:grid;place-items:center;background:var(--ink-2);max-width:100%}
.gal-item img,.gal-item video{width:100%;height:100%;object-fit:cover}
.gal-item video{object-fit:contain;background:#000}
.gal-item svg.art{width:100%;height:100%}
.gal-count{position:absolute;bottom:12px;inset-inline-end:12px;background:rgba(13,12,11,.75);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:2px 10px;font-size:12px;color:#fff}
.thumbs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.thumbs button{position:relative;width:64px;height:64px;flex:none;border-radius:12px;overflow:hidden;border:1px solid var(--line);opacity:.6;transition:opacity .2s,border-color .2s;background:var(--ink-2)}
.thumbs button.on{opacity:1;border-color:var(--gold)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs .vt{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);color:#fff}
.pinfo{display:grid;gap:16px;min-width:0}
.pinfo .tags{display:flex;gap:6px;flex-wrap:wrap}
.pinfo h1{margin:0;font-size:clamp(24px,5.6vw,34px);font-weight:600;line-height:1.3;text-wrap:balance}
[lang=en] .pinfo h1{font-family:var(--f-en)}
.pinfo .price b{font-size:26px}
.pinfo .price s{font-size:16px}
.stock{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ok)}
.stock::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.stock.low{color:var(--warn)}.stock.out{color:var(--bad)}
.pdesc{margin:0;color:var(--tx2);white-space:pre-line}
.contents{border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;background:var(--ink-1);box-shadow:var(--shadow)}
.contents h4{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--gold-hi);display:flex;align-items:center;gap:8px}
.contents ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.contents li{display:flex;gap:10px;align-items:flex-start;color:var(--tx2)}
.contents li::before{content:"";width:7px;height:7px;margin-top:9px;flex:none;background:var(--gold);transform:rotate(45deg)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;height:50px;background:var(--ink-1)}
.qty button{width:46px;height:100%;display:grid;place-items:center;color:var(--gold-hi)}
.qty button[disabled]{color:var(--faint)}
.qty span{min-width:30px;text-align:center;font-weight:600}
.buyrow{display:flex;gap:10px;flex-wrap:wrap}
.buyrow .btn{flex:1;min-width:150px}
.perks{display:grid;gap:10px;padding:0;margin:0;list-style:none;color:var(--mute);font-size:14px}
.perks li{display:flex;gap:10px;align-items:center}
.perks .ico{color:var(--gold)}

/* cart & checkout */
.cart-list{display:grid;gap:12px;align-content:start}
.ci-row{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border:1px solid var(--line-soft);border-radius:var(--r-md);background:var(--ink-1);box-shadow:var(--shadow)}
.ci-row .th{width:76px;height:76px;border-radius:12px;overflow:hidden;background:var(--ink-2)}
.ci-row .th img,.ci-row .th svg{width:100%;height:100%;object-fit:cover}
.ci-row h4{margin:0 0 4px;font-size:14.5px;font-weight:500;line-height:1.4}
.ci-row .qty{height:38px}.ci-row .qty button{width:34px}
.ci-row .rm{color:var(--faint);padding:8px}
.ci-row .rm:hover{color:var(--bad)}
.co{display:grid;gap:22px;padding-block:10px 20px}
@media (min-width:900px){.co{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:start}.co .sum{position:sticky;top:90px}}
.card{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--ink-1);padding:20px;display:grid;gap:16px;min-width:0;box-shadow:var(--shadow)}
.card h3{margin:0;font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px}
.card h3 .ico{color:var(--gold)}
.card.sum.dark{border-color:rgba(201,165,92,.55)}
.fld{display:grid;gap:6px;min-width:0}
.fld label,.fld .lb{font-size:13px;color:var(--mute)}
.fld .req{color:var(--rose)}
.inp{width:100%;min-height:50px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--ink);color:var(--cream);outline:none;transition:border-color .2s,box-shadow .2s}
textarea.inp{min-height:96px;resize:vertical;line-height:1.6}
.inp::placeholder{color:var(--faint)}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,165,92,.18)}
.inp.err{border-color:var(--bad)}
.ferr{color:var(--bad);font-size:12.5px}
.row2{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:560px){.row2{grid-template-columns:1fr 1fr}}
.tog{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;cursor:pointer;background:var(--ink)}
.tog .tt{display:grid;gap:2px;min-width:0}
.tog .tt b{font-weight:500;font-size:14.5px}
.tog .tt span{font-size:12.5px;color:var(--mute)}
.sw{position:relative;width:48px;height:28px;flex:none;border-radius:14px;background:var(--ink-3);border:1px solid var(--line);transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:var(--mute);transition:inset-inline-start .25s var(--ease),background .25s}
.tog input{position:absolute;opacity:0;pointer-events:none}
.tog input:checked+.sw{background:rgba(201,165,92,.28);border-color:var(--gold)}
.tog input:checked+.sw::after{inset-inline-start:23px;background:var(--gold)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;cursor:pointer;background:var(--ink)}
.opt input{accent-color:var(--gold);width:18px;height:18px}
.opt .tt{display:grid;gap:2px}
.opt .tt span{font-size:12.5px;color:var(--mute)}
.opt.on{border-color:var(--gold);background:var(--gold-tint)}
.sumrow{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;color:var(--mute)}
.sumrow b{color:var(--cream);font-weight:500}
.sumrow.tot{border-top:1px solid var(--line);padding-top:14px;font-size:17px;color:var(--cream)}
.sumrow.tot b{color:var(--gold-hi);font-size:20px;font-weight:600}
.sumrow.dis b{color:var(--ok)}
.coupon{display:flex;gap:8px}
.coupon .inp{min-height:46px;text-transform:uppercase}
.note{font-size:12.5px;color:var(--mute);display:flex;gap:8px;align-items:flex-start}
.note .ico{color:var(--gold);flex:none}
.done{display:grid;justify-items:center;text-align:center;gap:14px;padding-block:50px 30px;max-width:560px;margin-inline:auto}
.done .ok{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--gold);color:var(--gold-hi);background:radial-gradient(circle,rgba(201,165,92,.22),transparent 70%)}
.done .ok .ico{width:40px;height:40px}
.done h1{margin:0;font-size:clamp(24px,5.6vw,32px);font-weight:600}
.done .ono{font-family:var(--f-en);font-weight:600;letter-spacing:.12em;color:var(--gold-hi);font-size:20px}
.steps-n{display:grid;gap:10px;text-align:start;width:100%;margin:6px 0;padding:0;list-style:none;counter-reset:s}
.steps-n li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;color:var(--tx2);font-size:14.5px}
.steps-n li::before{content:counter(s);width:26px;height:26px;flex:none;border-radius:50%;border:1px solid var(--gold);color:var(--gold-hi);display:grid;place-items:center;font-size:13px}

/* reviews */
.revs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:14px}
.rv{border:1px solid var(--line-soft);border-radius:var(--r-md);background:var(--ink-1);padding:18px;display:grid;gap:10px;align-content:start;box-shadow:var(--shadow)}
.stars{display:inline-flex;gap:2px;color:var(--gold)}
.stars .ico{width:16px;height:16px;fill:currentColor;stroke:none}
.stars .off{color:var(--ink-3)}
.rv p{margin:0;color:var(--tx2);font-size:14.5px}
.rv .who{display:flex;justify-content:space-between;gap:10px;color:var(--mute);font-size:13px}
.starpick{display:flex;gap:6px;direction:ltr}
.starpick button{color:var(--ink-3);padding:4px}
.starpick button.on{color:var(--gold)}
.starpick .ico{width:32px;height:32px;fill:currentColor;stroke:none}

/* contact */
.contact{border:1px solid rgba(201,165,92,.55);border-radius:var(--r-lg);overflow:hidden;display:grid;grid-template-columns:1fr;background:radial-gradient(70% 120% at 100% 0,rgba(201,165,92,.12),transparent 60%),var(--ink-1)}
@media (min-width:860px){.contact{grid-template-columns:1.1fr 1fr}}
.contact .cpad{padding:24px;display:grid;gap:14px;align-content:start}
.contact h2{margin:0;font-size:clamp(21px,4.6vw,28px);font-weight:600}
.walabel{font-size:13px;color:var(--gold-hi);font-weight:500}
.wanum{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wanum .n{display:inline-flex;align-items:center;gap:10px;font-size:24px;font-weight:600;letter-spacing:.04em;color:var(--cream)}
.wanum .n .fab-i{width:26px;height:26px;color:var(--wa)}
.copyb{display:inline-flex;align-items:center;gap:6px;height:34px;padding-inline:12px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:var(--mute)}
.copyb:hover{color:var(--cream);border-color:var(--gold)}
.socials{display:flex;gap:10px;flex-wrap:wrap}
.soc{display:inline-flex;align-items:center;gap:8px;height:42px;padding-inline:14px;border-radius:999px;border:1px solid var(--line);font-size:14px}
.soc:hover{border-color:var(--gold)}
.soc .fab-i{width:18px;height:18px;color:var(--gold-hi)}
.contact .facts{border-top:1px solid var(--line);padding:24px;display:grid;gap:14px;align-content:start;background:var(--ink-2)}
@media (min-width:860px){.contact .facts{border-top:0;border-inline-start:1px solid var(--line)}}
.fact{display:flex;gap:12px;align-items:flex-start}
.fact .ico{color:var(--gold);margin-top:2px}
.fact b{display:block;font-weight:500}
.fact span{color:var(--mute);font-size:13.5px}

/* byo teaser */
.byo{display:grid;gap:14px;border:1px dashed var(--gold-lo);border-radius:var(--r-lg);padding:24px;background:linear-gradient(135deg,rgba(232,188,181,.07),transparent 60%)}
.byo h3{margin:0;font-size:20px;font-weight:600}
.byo p{margin:0;color:var(--mute)}

/* footer */
.ftr{border-top:1px solid rgba(201,165,92,.4);padding-block:34px 110px;color:var(--mute);font-size:13.5px;background:var(--black)}
.ftr .wrap{display:grid;gap:16px;justify-items:center;text-align:center}
.ftr svg.seal-s{width:70px;height:70px}
.ftr .story-s{font-family:var(--f-ruqaa);color:var(--gold-hi);font-size:18px}
.ftr .fl{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.ftr .fl a,.ftr .fl button{color:#e9e1d2}
.ftr .fl a:hover,.ftr .fl button:hover{color:var(--gold-hi)}

/* floating whatsapp + cart bar */
.wafab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-start:calc(16px + env(safe-area-inset-left,0px));z-index:40;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#25d366;color:#fff;box-shadow:0 10px 30px -8px rgba(37,211,102,.55),0 0 0 6px rgba(37,211,102,.12)}
[dir=rtl] .wafab{inset-inline-start:auto;inset-inline-end:calc(16px + env(safe-area-inset-right,0px))}
.wafab .fab-i{width:30px;height:30px}
.cartbar{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));right:calc(16px + env(safe-area-inset-right,0px));z-index:41;display:flex;align-items:center;gap:12px;height:56px;padding-inline:20px 8px;border-radius:999px;background:var(--night);color:#fff;border:1px solid var(--gold);box-shadow:0 14px 40px -12px rgba(0,0,0,.75);font-weight:600;white-space:nowrap;max-width:calc(100vw - 110px)}
.cartbar .cb-n{display:grid;place-items:center;height:40px;padding-inline:14px;border-radius:999px;background:var(--gold);color:var(--on-gold);font-size:14px}

/* toast + modal */
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:200;background:#211d18;color:#f7f2e8;border:1px solid #8c6f38;padding:12px 18px;border-radius:14px;font-size:14px;transition:.3s var(--ease);pointer-events:none;max-width:calc(100vw - 32px);text-align:center;box-shadow:0 12px 30px -10px rgba(0,0,0,.7)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-color:#e3806f}
.mdl{position:fixed;inset:0;z-index:150;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,4,3,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .2s}
@media (min-width:720px){.mdl{align-items:center;padding:24px}}
.mdl-box{width:100%;max-width:640px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:var(--ink-1);border:1px solid var(--line);border-top:2px solid var(--gold);border-radius:22px 22px 0 0;animation:up .3s var(--ease);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:720px){.mdl-box{border-radius:22px}}
.mdl-box.wide{max-width:860px}
.mdl-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-soft)}
.mdl-h h3{margin:0;font-size:17px;font-weight:600}
.mdl-b{padding:20px;overflow:auto;display:grid;gap:16px;align-content:start}
.mdl-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line-soft);flex-wrap:wrap}
.mdl-f .btn{min-width:120px}
.xbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--mute);border:1px solid var(--line)}
.xbtn:hover{color:var(--cream)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}

/* ================= ADMIN ================= */
.adm-wrap{min-height:100vh;background:var(--black)}
.atop{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(13,12,11,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(201,165,92,.4)}
.atop .wrap{display:flex;align-items:center;gap:10px;min-height:64px;flex-wrap:wrap;padding-block:8px}
.atop .ttl{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.atop .ttl>svg{width:40px;height:40px;flex:none}
.atop .ttl b{font-weight:600;font-size:16px;white-space:nowrap;color:var(--white)}
.atop .ttl span{display:block;font-size:12px;color:var(--mute)}
.atop .ib{color:#d8cebd}
.dirty-pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--warn);white-space:nowrap}
.dirty-pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
.clean-pill{font-size:12.5px;color:var(--ok);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
@keyframes pulse{50%{opacity:.35}}
.adm-body{min-height:calc(100vh - 64px)}
.alay{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:980px){.alay{grid-template-columns:236px minmax(0,1fr);gap:28px}}
.atabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:12px;border-bottom:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);background:var(--ink);z-index:20}
.atabs::-webkit-scrollbar{display:none}
@media (min-width:980px){.atabs{flex-direction:column;border-bottom:0;padding-block:24px;top:calc(env(safe-area-inset-top,0px) + 80px);align-self:start;overflow:visible}}
.atab{display:flex;align-items:center;gap:10px;height:44px;padding-inline:14px;border-radius:12px;color:var(--tx2);white-space:nowrap;font-size:14.5px;flex:none;transition:background .2s,color .2s}
.atab .ico{color:var(--gold-hi)}
.atab:hover{background:var(--ink-2);color:var(--cream)}
.atab.on{background:var(--night);color:#ecd49a;box-shadow:0 10px 20px -14px rgba(23,19,14,.8)}
.atab.on .ico{color:#ecd49a}
.atab .cnt{margin-inline-start:auto;font-size:11.5px;background:var(--ink-3);color:var(--mute);border-radius:8px;padding:0 7px}
.atab.on .cnt{background:rgba(201,165,92,.25);color:#ecd49a}
.amain{padding-block:22px 80px;display:grid;gap:20px;align-content:start;min-width:0}
.ah{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.ah h2{margin:0;font-size:22px;font-weight:600}
.ah p{margin:4px 0 0;color:var(--mute);font-size:14px;max-width:62ch}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:760px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{border:1px solid var(--line-soft);border-radius:var(--r-md);background:var(--ink-1);padding:16px;display:grid;gap:4px;box-shadow:var(--shadow)}
.stat span{font-size:12.5px;color:var(--mute)}
.stat b{font-size:26px;font-weight:600;color:var(--cream)}
.stat small{font-size:12px;color:var(--faint)}
.stat:first-child{background:var(--night);border-color:var(--night)}
.stat:first-child span,.stat:first-child small{color:#b9ad97}
.stat:first-child b{color:#ecd49a}
.alist{display:grid;gap:10px}
.aitem{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px;border:1px solid var(--line-soft);border-radius:var(--r-md);background:var(--ink-1);box-shadow:var(--shadow)}
.aitem.off{opacity:.6}
.aitem .th{width:64px;height:64px;border-radius:14px;overflow:hidden;background:var(--ink-2);display:grid;place-items:center;color:var(--gold-hi)}
.aitem .th.st-gold{background:var(--g-gold)}.aitem .th.st-rose{background:var(--g-rose)}.aitem .th.st-noir{background:var(--g-noir)}.aitem .th.st-champ{background:var(--g-champ)}
.aitem .th.st-gold,.aitem .th.st-rose,.aitem .th.st-noir,.aitem .th.st-champ{color:#ecd49a;border:1px solid rgba(201,165,92,.5)}
.aitem .th.shut{background:var(--white);border:1px dashed #d6c497;color:#b8a988}
.aitem .th img,.aitem .th svg.art{width:100%;height:100%;object-fit:cover}
.aitem h4{margin:0;font-size:15px;font-weight:500;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.acts{display:flex;gap:4px;align-items:center}
.ib{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--mute);border:1px solid transparent}
.ib:hover{color:var(--cream);border-color:var(--line);background:var(--ink-2)}
.ib.dng:hover{color:var(--bad)}
.lkb{display:inline-flex;align-items:center;gap:6px;height:36px;padding-inline:12px;border-radius:999px;border:1px solid var(--gold-lo);color:var(--gold-hi);font-size:13px;font-weight:500;white-space:nowrap;margin-inline-end:4px}
.lkb:hover{background:var(--gold-tint)}
.lkb.go-open{background:var(--night);border-color:var(--night);color:#ecd49a}
.lkb.go-open:hover{background:#000}
.ib[disabled]{opacity:.3;pointer-events:none}
@media (max-width:560px){.aitem{grid-template-columns:52px minmax(0,1fr)}.aitem .th{width:52px;height:52px}.aitem .acts{grid-column:1/-1;justify-content:flex-end;border-top:1px solid var(--line-soft);padding-top:8px}}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.mitem{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--ink-2)}
.mitem img,.mitem video{width:100%;height:100%;object-fit:cover}
.mitem .mt{position:absolute;inset:auto 0 0;display:flex;justify-content:space-between;padding:4px;background:linear-gradient(0deg,rgba(0,0,0,.8),transparent)}
.mitem .mt button{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:rgba(13,12,11,.75);color:#fff}
.mitem .mt button:hover{color:#ecd49a}
.mitem .cover{position:absolute;top:6px;inset-inline-start:6px;font-size:10.5px;background:#c9a55c;color:#1a140a;border-radius:6px;padding:1px 6px;font-weight:600}
.mitem .vb{position:absolute;top:6px;inset-inline-end:6px;background:rgba(0,0,0,.6);border-radius:6px;padding:2px;color:#fff}
.upl{aspect-ratio:1;border:1px dashed var(--gold-lo);border-radius:12px;display:grid;place-items:center;align-content:center;gap:4px;color:var(--gold-hi);font-size:12px;text-align:center;cursor:pointer;position:relative;padding:6px;background:var(--ink)}
.upl:hover{background:var(--gold-tint)}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.upl.busy{pointer-events:none;opacity:.6}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:40px;padding-inline:14px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;color:var(--tx2);display:inline-flex;align-items:center;gap:6px;background:var(--ink-1)}
.seg button.on{border-color:var(--gold);color:var(--gold-hi);background:var(--gold-tint);font-weight:500}
.seg.status button{flex:1;min-width:140px;flex-direction:column;align-items:flex-start;gap:2px;padding-block:10px;border-radius:14px;text-align:start}
.seg.status button small{font-size:11.5px;color:var(--mute);font-weight:400}
.seg.status button b{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.seg.status button.on{background:var(--night);border-color:var(--night);color:#ecd49a}
.seg.status button.on small{color:#c3b79f}
.swatch{width:20px;height:20px;border-radius:6px;border:1px solid var(--line)}
.helper{font-size:12.5px;color:var(--faint)}
.notice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--ink-1);font-size:14px;color:var(--tx2)}
.notice .ico{color:var(--gold);flex:none;margin-top:2px}
.notice.warn{border-color:rgba(230,180,95,.55);background:rgba(230,180,95,.08)}
.notice.warn .ico{color:var(--warn)}
.notice.bad{border-color:rgba(214,108,88,.5);background:rgba(227,128,111,.07)}
.notice .nb{display:grid;gap:8px;min-width:0}
.zrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 110px auto;gap:8px;align-items:center;padding:10px;border:1px solid var(--line-soft);border-radius:14px;background:var(--ink-1)}

.ost{display:inline-flex;align-items:center;gap:6px;height:26px;padding-inline:10px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid}
.ost::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

function ghApi(method,path,body,accept){var h={'Authorization':'Bearer '+(GHT&&GHT.token),'Accept':accept||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};if(body)h['Content-Type']='application/json';

function b64utf8(str){var bytes=new TextEncoder().encode(str);var bin='';for(var i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin)}

/* ----- publish (one commit: store.json + new media, unused media removed) ----- */
function mediaRefs(){var m={};function add(p){if(p&&/^media\//.test(p))m[p]=1}S.categories.forEach(function(c){add(c.img)});S.banners.forEach(function(b){add(b.img)});S.products.forEach(function(p){(p.media||[]).forEach(function(x){add(x.src);add(x.poster)})});return m}
function ghPublish(){var R='/repos/'+GH.owner+'/'+GH.repo,base,treeSha,refs=mediaRefs();
 return ghApi('GET',R+'/git/ref/heads/'+GH.branch).then(function(ref){base=ref.object.sha;return ghApi('GET',R+'/git/commits/'+base)}).then(function(c){treeSha=c.tree.sha;return ghApi('GET',R+'/git/trees/'+treeSha+'?recursive=1')}).then(function(tr){
  var st=clone(S);st.v=1;st.updated=Date.now();
  var entries=[{path:'data/store.json',mode:'100644',type:'blob',content:JSON.stringify(st)}];
  Object.keys(MEDIA).forEach(function(p){if(refs[p]&&MEDIA[p].sha&&!MEDIA[p].live)entries.push({path:p,mode:'100644',type:'blob',sha:MEDIA[p].sha})});
  if(!tr.truncated)(tr.tree||[]).forEach(function(it){if(it.type==='blob'&&/^media\/.+\.(webp|jpe?g|png|mp4|webm)$/i.test(it.path)&&!refs[it.path])entries.push({path:it.path,mode:'100644',type:'blob',sha:null})});
  return ghApi('POST',R+'/git/trees',{base_tree:treeSha,tree:entries})}).then(function(t){return ghApi('POST',R+'/git/commits',{message:'تحديث المتجر من لوحة التحكم',tree:t.sha,parents:[base]})}).then(function(c){return ghApi('PATCH',R+'/git/refs/heads/'+GH.branch,{sha:c.sha})}).then(function(){Object.keys(MEDIA).forEach(function(p){MEDIA[p].live=true});PUB_HASH=cyrb(JSON.stringify(S))})}

 A.busy=true;renderAdmin();
 ghPublish().then(function(){A.busy=false;A.dirty=false;store.del('sirr_draft');if(route.v==='admin')renderAdmin();else render();toast('انتشر! التعديلات بتظهر للزباين خلال دقيقة تقريباً')},function(e){A.busy=false;if(route.v==='admin')renderAdmin();else render();var st=e&&e.status;
  toast(st===401?'المفتاح انتهت صلاحيته. سجّل خروج وادخل بمفتاح جديد.':st===403||st===404?'المفتاح ما معه صلاحية الكتابة على المتجر. تأكد من Contents: Read and write.':st===409||st===422?'في تعديل أحدث على المتجر. حدّث الصفحة وجرّب مرة ثانية.':'ما زبط النشر. تأكد من الإنترنت وجرّب مرة ثانية.',true)})}

/* ---------- admin access (GitHub key) ---------- */
function initGH(){if(!GHT){cap.ready=true;cap.owner=false;return Promise.resolve(false)}
 return ghApi('GET','/repos/'+GH.owner+'/'+GH.repo).then(function(r){cap.owner=!r.permissions||!!r.permissions.push;if(!cap.owner)A.loginErr='المفتاح ما معه صلاحية الكتابة على المتجر.'},function(e){cap.owner=false;A.loginErr=e.status===401?'المفتاح غير صالح أو انتهت صلاحيته. اعمل مفتاح جديد.':e.status===404||e.status===403?'المفتاح ما بيوصل لمستودع المتجر. تأكد إنك اخترت '+GH.repo+' و '+GH.priv+'.':'ما قدرنا نتحقق من المفتاح. تأكد من الإنترنت وجرّب.'}).then(function(){cap.ready=true;if(!cap.owner&&A.loginErr&&GHT){GHT=null;store.del('sirr_gh')}return cap.owner})}
function checkDraft(){var dr=jget('sirr_draft',null);A.draft=null;if(dr&&dr.st){var dh=cyrb(JSON.stringify(deepFill(dr.st,DEF)));if(dh===PUB_HASH)store.del('sirr_draft');else A.draft=dr}}
function afterOwner(){checkDraft();loadPriv()}
function doLogin(tok){GHT={token:tok};A.loginErr='';A.loginBusy=true;render();
 initGH().then(function(ok){A.loginBusy=false;if(!ok){GHT=null;render();return}store.set('sirr_gh',JSON.stringify(GHT));LOADED=false;render();return loadStore().then(function(){afterOwner();render();toast('أهلاً فيك')})})}

/* ---------- boot ---------- */
function boot(){
 app=document.getElementById('app');modalRoot=document.getElementById('modal-root');if(!modalRoot){modalRoot=document.createElement('div');modalRoot.id='modal-root';document.body.appendChild(modalRoot)}
 var ret=sess.get('sirr_return');if(ret){sess.del('sirr_return');try{var r=JSON.parse(ret);A.tab=r.tab||'overview'}catch(e){}if(location.hash!=='#admin'){try{location.hash='admin'}catch(e){}}}
 route=parseHash();if(ret)route={v:'admin',id:''};
 render();initGH().then(loadStore).then(function(){if(cap.owner)afterOwner();if(route.v==='prod')pq=1;render()});
 window.addEventListener('beforeunload',function(e){if(A.dirty&&!A.busy){e.preventDefault();e.returnValue=''}});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
